name: Daily NSE Signal Pipeline
on:
  workflow_dispatch:  # manual trigger only - no automatic schedule
jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install python-dotenv requests pandas yfinance
      - name: Run full pipeline
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          RUN_LABEL: "Pre-Market 8:30 AM"
        run: |
          python backend/full_pipeline.py
      - name: Notify on failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.CHAT_ID }}" \
            -d text="ALERT: Daily NSE Signal Pipeline FAILED. Check: https://github.com/Dev8735/Real_Trade/actions"
