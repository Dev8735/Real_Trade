name: Daily Accuracy Checker

on:
  workflow_dispatch:  # manual trigger only - no automatic schedule

jobs:
  run-accuracy-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pandas yfinance

      - name: Run accuracy checker
        run: |
          python backend/accuracy_checker.py

      - name: Notify on failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.CHAT_ID }}" \
            -d text="ALERT: Daily Accuracy Checker FAILED. Check: https://github.com/Dev8735/Real_Trade/actions"

      - name: Commit updated accuracy artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p data
          git add data/
          if git diff --staged --quiet; then
            echo "No accuracy artifact changes to commit."
            exit 0
          fi
          git commit -m "chore: update accuracy tracking data [automated]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
