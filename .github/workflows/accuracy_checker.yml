name: Daily Accuracy Checker

on:
  schedule:
    - cron: "30 12 * * 1-5"
  workflow_dispatch:

jobs:
  run-accuracy-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pandas yfinance

      - name: Run accuracy checker
        run: |
          python backend/accuracy_checker.py

      - name: Commit updated accuracy artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p data
          git add data/
          if ! git diff --staged --quiet; then
            git commit -m "chore: update accuracy tracking data [automated]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
