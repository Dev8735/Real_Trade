name: Daily Accuracy Checker

on:
  schedule:
    # 6:00 PM IST = 12:30 UTC
    - cron: "30 12 * * 1-5"
  workflow_dispatch:

jobs:
  run-accuracy-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pandas yfinance

      - name: Run accuracy checker
        run: |
          python backend/accuracy_checker.py

      - name: Commit updated signals log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/signals_log.csv
          git diff --staged --quiet || git commit -m "chore: update accuracy tracking data [automated]"
          git push
