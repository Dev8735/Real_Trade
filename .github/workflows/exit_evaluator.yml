name: Daily Exit Evaluator

on:
  workflow_dispatch:  # manual trigger only - no automatic schedule

jobs:
  run-exit-evaluator:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pandas yfinance python-dotenv

      - name: Run exit evaluator
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python backend/exit_evaluator.py

      - name: Notify on failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.CHAT_ID }}" \
            -d text="ALERT: Daily Exit Evaluator FAILED. Check: https://github.com/Dev8735/Real_Trade/actions"

      - name: Commit updated positions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/positions.csv
          git diff --staged --quiet || git commit -m "chore: update positions tracking [automated]"
          git push
